<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="10" fill="#1A3A6B"/>
  <!-- Activity bar chart bars -->
  <!-- Bar 1 (short) -->
  <rect x="7" y="30" width="6" height="11" rx="2" fill="#4D9EFF" opacity="0.6"/>
  <!-- Bar 2 (medium) -->
  <rect x="16" y="22" width="6" height="19" rx="2" fill="#4D9EFF" opacity="0.8"/>
  <!-- Bar 3 (tall) -->
  <rect x="25" y="13" width="6" height="28" rx="2" fill="#4D9EFF"/>
  <!-- Bar 4 (medium-tall) -->
  <rect x="34" y="18" width="6" height="23" rx="2" fill="#60C6FF"/>
  <!-- Trend line accent -->
  <polyline points="10,29 19,21 28,12 37,17" stroke="#60C6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
</svg>